<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14213D" />
  <script>
    try { var t = localStorage.getItem("sava-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/inner.css" />
  <title>All Posts | SAVA</title>
  <meta name="description" content="Browse government jobs, results, admit cards, answer keys, syllabus and admissions. Filter by category, state and qualification." />
</head>
<body>
  <header class="sava-header">
    <a class="sava-brand" href="/" aria-label="SAVA home"><span class="sava-brand-mark">S</span>SAVA</a>
    <form class="sava-search" id="searchForm" role="search" action="/posts" autocomplete="off">
      <input id="searchInput" name="q" type="search" placeholder="Search jobs, results, admit cards" aria-label="Search posts" />
      <button type="submit">Search</button>
    </form>
    <button class="sava-icon-btn" id="themeBtn" type="button" aria-label="Switch between light and dark theme"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg></button>
  </header>

  <main class="sava-main" id="main">
    <nav class="sava-crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span aria-hidden="true">/</span><span id="crumbLabel">All posts</span></nav>
    <div class="sava-ls-head">
      <h1 id="listTitle">All posts</h1>
      <p class="sava-ls-count" id="listCount" role="status" aria-live="polite"></p>
    </div>
    <nav class="sava-ls-tabs" id="typeTabs" aria-label="Category"></nav>
    <form class="sava-ls-filters" id="filterForm">
      <label class="sava-sr-only" for="stateSel">State</label>
      <select id="stateSel"><option value="">All states</option></select>
      <label class="sava-sr-only" for="qualSel">Qualification</label>
      <select id="qualSel"><option value="">Any qualification</option></select>
      <button type="button" id="clearBtn">Clear filters</button>
    </form>
    <ul class="sava-ls-list" id="postList" aria-live="polite"></ul>
    <nav class="sava-pager" id="pager" aria-label="Pages"></nav>
  </main>

  <footer class="sava-footer">
    <p><strong>SAVA</strong> is an independent information website and is not connected to any government body. Always confirm dates, eligibility and fees on the official notification before you apply.</p>
    <nav aria-label="Footer"><a href="/about">About</a><a href="/contact">Contact</a><a href="/disclaimer">Disclaimer</a><a href="/privacy">Privacy policy</a></nav>
  </footer>
  <nav class="sava-tabbar" aria-label="Quick navigation">
    <a href="/">Home</a><a href="/posts?type=job">Jobs</a><a href="/posts?type=result">Results</a><a href="/posts?type=admit_card">Admit cards</a><a href="/#subscribe">Alerts</a>
  </nav>
  <script src="/js/sava-ui.js"></script>
  <script src="/js/posts.js"></script>
</body>
</html>
